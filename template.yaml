AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NYC Yellow Taxi Data Pipeline - Bronze to Silver to Gold Finance

Resources:
  # ==================== S3 BUCKETS ====================

  BronzeTaxiBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub nyc-taxi-bronze-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldData
            Status: Enabled
            ExpirationInDays: 365
            NoncurrentVersionExpirationInDays: 30

  SilverTaxiBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub nyc-taxi-silver-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldData
            Status: Enabled
            ExpirationInDays: 730

  GoldTaxiBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub nyc-taxi-gold-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldData
            Status: Enabled
            ExpirationInDays: 1095

  GlueScriptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub nyc-taxi-glue-scripts-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled

  # ==================== LAMBDA FUNCTIONS ====================

  TaxiExtractorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-bronze-ingest
      Description: Downloads NYC Yellow Taxi data to Bronze S3 and triggers Step Functions pipeline
      CodeUri: src/
      Handler: lambda_function.lambda_handler
      Runtime: python3.11
      Timeout: 300
      MemorySize: 512
      EphemeralStorage:
        Size: 1024
      Environment:
        Variables:
          BUCKET: !Ref BronzeTaxiBucket
          BASE_URL: https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_{year_month}.parquet

      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - arn:aws:s3:::nyc-tlc
                - arn:aws:s3:::nyc-tlc/*

            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectAcl
                - s3:ListBucket
              Resource:
                - !GetAtt BronzeTaxiBucket.Arn
                - !Sub "${BronzeTaxiBucket.Arn}/*"

            - Effect: Allow
              Action:
                - glue:StartCrawler
              Resource: !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:crawler/${BronzeTaxiCrawler}"


  # ==================== GLUE DATABASE ====================

  TaxiDataCatalogDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: nyc_taxi_db
        Description: Glue Data Catalog for NYC Yellow Taxi pipeline (Bronze, Silver, and Gold layers)

  # ==================== GLUE IAM ROLE ====================

  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-glue-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole

      Policies:
        - PolicyName: GlueCatalogAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:CreateDatabase
                  - glue:GetTable
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                  - glue:BatchCreatePartition
                  - glue:BatchDeletePartition
                  - glue:GetPartition
                  - glue:GetPartitions
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/nyc_taxi_db
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/nyc_taxi_db/*

        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt BronzeTaxiBucket.Arn
                  - !Sub ${BronzeTaxiBucket.Arn}/*
                  - !GetAtt SilverTaxiBucket.Arn
                  - !Sub ${SilverTaxiBucket.Arn}/*
                  - !GetAtt GoldTaxiBucket.Arn
                  - !Sub ${GoldTaxiBucket.Arn}/*
                  - !GetAtt GlueScriptsBucket.Arn
                  - !Sub ${GlueScriptsBucket.Arn}/*

        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*

  # ==================== GLUE CRAWLERS ====================

  BronzeTaxiCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub ${AWS::StackName}-bronze-crawler
      Description: Crawls Bronze layer to catalog raw NYC taxi data
      Role: !GetAtt GlueJobRole.Arn
      DatabaseName: !Ref TaxiDataCatalogDatabase
      Targets:
        S3Targets:
          - Path: !Sub s3://${BronzeTaxiBucket}/yellow/
      TablePrefix: bronze_
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: DEPRECATE_IN_DATABASE
      RecrawlPolicy:
        RecrawlBehavior: CRAWL_EVERYTHING
      Configuration: |
        {
          "Version": 1.0,
          "CrawlerOutput": {
            "Partitions": {"AddOrUpdateBehavior": "InheritFromTable"}
          }
        }

  SilverTaxiCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub ${AWS::StackName}-silver-crawler
      Description: Crawls Silver layer to catalog cleaned NYC taxi data
      Role: !GetAtt GlueJobRole.Arn
      DatabaseName: !Ref TaxiDataCatalogDatabase
      Targets:
        S3Targets:
          - Path: !Sub s3://${SilverTaxiBucket}/yellow/
      TablePrefix: silver_
      SchemaChangePolicy:
        UpdateBehavior: LOG
        DeleteBehavior: LOG
      RecrawlPolicy:
        RecrawlBehavior: CRAWL_EVERYTHING
      Configuration: |
        {
          "Version": 1.0,
          "CrawlerOutput": {
            "Partitions": {"AddOrUpdateBehavior": "InheritFromTable"}
          }
        }

  GoldTaxiCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub ${AWS::StackName}-gold-crawler
      Description: Crawls Gold layer to catalog business-ready data
      Role: !GetAtt GlueJobRole.Arn
      DatabaseName: !Ref TaxiDataCatalogDatabase
      Targets:
        S3Targets:
          - Path: !Sub s3://${GoldTaxiBucket}/finance/
      TablePrefix: gold_
      SchemaChangePolicy:
        UpdateBehavior: LOG
        DeleteBehavior: LOG
      RecrawlPolicy:
        RecrawlBehavior: CRAWL_EVERYTHING

  GoldOperationsCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub ${AWS::StackName}-gold-operations-crawler
      Description: Crawls Gold layer to catalog business-ready data
      Role: !GetAtt GlueJobRole.Arn
      DatabaseName: !Ref TaxiDataCatalogDatabase
      Targets:
        S3Targets:
          - Path: !Sub s3://${GoldTaxiBucket}/operations/
      TablePrefix: gold_
      SchemaChangePolicy:
        UpdateBehavior: LOG
        DeleteBehavior: LOG
      RecrawlPolicy:
        RecrawlBehavior: CRAWL_EVERYTHING

  # ==================== GLUE ETL JOBS ====================

  TaxiSilverTransformationJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub ${AWS::StackName}-bronze-to-silver
      Description: Transforms NYC Yellow Taxi data from Bronze to Silver layer with data quality checks
      Role: !GetAtt GlueJobRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub s3://${GlueScriptsBucket}/scripts/bronze_to_silver_transformation.py
        PythonVersion: "3"
      GlueVersion: "4.0"
      WorkerType: G.1X
      NumberOfWorkers: 2
      MaxRetries: 2
      Timeout: 60
      DefaultArguments:
        "--job-language": "python"
        "--job-bookmark-option": "job-bookmark-enable"
        "--enable-metrics": "true"
        "--enable-spark-ui": "true"
        "--enable-continuous-cloudwatch-log": "true"
        "--enable-glue-datacatalog": "true"
        "--TempDir": !Sub s3://${GlueScriptsBucket}/temp/
        "--BRONZE_BUCKET": !Ref BronzeTaxiBucket
        "--SILVER_BUCKET": !Ref SilverTaxiBucket
        "--DATABASE_NAME": !Ref TaxiDataCatalogDatabase
      ExecutionProperty:
        MaxConcurrentRuns: 1

  GoldFinanceJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub ${AWS::StackName}-silver-to-gold-finance
      Description: Creates Gold Finance layer with revenue and payment analytics
      Role: !GetAtt GlueJobRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub s3://${GlueScriptsBucket}/scripts/silver_to_gold_finance.py
        PythonVersion: "3"
      GlueVersion: "4.0"
      WorkerType: G.1X
      NumberOfWorkers: 2
      MaxRetries: 2
      Timeout: 60
      DefaultArguments:
        "--job-language": "python"
        "--job-bookmark-option": "job-bookmark-enable"
        "--enable-metrics": "true"
        "--enable-spark-ui": "true"
        "--enable-continuous-cloudwatch-log": "true"
        "--enable-glue-datacatalog": "true"
        "--TempDir": !Sub s3://${GlueScriptsBucket}/temp/
        "--SILVER_BUCKET": !Ref SilverTaxiBucket
        "--GOLD_BUCKET": !Ref GoldTaxiBucket
        "--DATABASE_NAME": !Ref TaxiDataCatalogDatabase
      ExecutionProperty:
        MaxConcurrentRuns: 1


  GoldOperationsJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub ${AWS::StackName}-silver-to-operations
      Description: Creates Gold Operations layer with revenue and payment analytics
      Role: !GetAtt GlueJobRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub s3://${GlueScriptsBucket}/scripts/silver_to_gold_operations.py
        PythonVersion: "3"
      GlueVersion: "4.0"
      WorkerType: G.1X
      NumberOfWorkers: 2
      MaxRetries: 2
      Timeout: 60
      DefaultArguments:
        "--job-language": "python"
        "--job-bookmark-option": "job-bookmark-enable"
        "--enable-metrics": "true"
        "--enable-spark-ui": "true"
        "--enable-continuous-cloudwatch-log": "true"
        "--enable-glue-datacatalog": "true"
        "--TempDir": !Sub s3://${GlueScriptsBucket}/temp/
        "--SILVER_BUCKET": !Ref SilverTaxiBucket
        "--GOLD_BUCKET": !Ref GoldTaxiBucket
        "--DATABASE_NAME": !Ref TaxiDataCatalogDatabase
      ExecutionProperty:
        MaxConcurrentRuns: 1

  # ==================== STEP FUNCTIONS ====================

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/stepfunctions/${AWS::StackName}-pipeline
      RetentionInDays: 30

  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-stepfunctions-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsGlueAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - glue:StartCrawler
                  - glue:GetCrawler
                  - glue:StartJobRun
                  - glue:GetJobRun
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:crawler/*
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:job/*

        - PolicyName: StepFunctionsLambdaAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt TaxiExtractorFunction.Arn


        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"

  TaxiDataPipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub ${AWS::StackName}-pipeline
      DefinitionUri: statemachine/taxi_pipeline.asl.json
      DefinitionSubstitutions:
        BronzeIngestLambda: !Ref TaxiExtractorFunction
        BronzeCrawlerName: !Ref BronzeTaxiCrawler
        SilverETLJobName: !Ref TaxiSilverTransformationJob
        SilverCrawlerName: !Ref SilverTaxiCrawler
        GoldFinanceJobName: !Ref GoldFinanceJob
        GoldOperationsJobName: !Ref GoldOperationsJob
        GoldCrawlerName: !Ref GoldTaxiCrawler
        GoldOperationsCrawlerName: !Ref GoldOperationsCrawler
      Role: !GetAtt StepFunctionsExecutionRole.Arn
      Type: STANDARD
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn

  # ==================== CLOUDWATCH ALARMS ====================

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-lambda-errors
      AlarmDescription: Alert when Lambda function fails
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref TaxiExtractorFunction
      TreatMissingData: notBreaching

  GlueJobFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-glue-job-failures
      AlarmDescription: Alert when Glue ETL job fails
      MetricName: glue.driver.aggregate.numFailedTasks
      Namespace: Glue
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching


  StepFunctionsFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-pipeline-failures
      AlarmDescription: Alert when Step Functions execution fails
      MetricName: ExecutionsFailed
      Namespace: AWS/States
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref TaxiDataPipelineStateMachine
      TreatMissingData: notBreaching

  MonthlyPipelineTrigger:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-monthly-trigger
      Description: Trigger taxi data pipeline on 26th of every month
      ScheduleExpression: cron(30 00 09 * ? *)
      State: ENABLED
      Targets:
        - Arn: !Ref TaxiDataPipelineStateMachine
          RoleArn: !GetAtt EventBridgeStepFunctionsRole.Arn
          Id: TaxiPipelineTarget

  EventBridgeStepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-eventbridge-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStepFunctions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  - !Ref TaxiDataPipelineStateMachine

# SNS Topic for all pipeline notifications
PipelineNotificationTopic:
  Type: AWS::SNS::Topic
  Properties:
    TopicName: !Sub ${AWS::StackName}-pipeline-alerts
    DisplayName: NYC Taxi Pipeline Alerts
    Subscription:
      - Endpoint: your-email@example.com  # CHANGE THIS
        Protocol: email

# EventBridge Rule: Pipeline Failed
PipelineFailureRule:
  Type: AWS::Events::Rule
  Properties:
    Name: !Sub ${AWS::StackName}-pipeline-failure
    State: ENABLED
    EventPattern:
      source:
        - aws.states
      detail-type:
        - Step Functions Execution Status Change
      detail:
        status:
          - FAILED
          - TIMED_OUT
          - ABORTED
        stateMachineArn:
          - !Ref TaxiPipelineStateMachine
    Targets:
      - Arn: !Ref PipelineNotificationTopic
        Id: FailureNotification
        InputTransformer:
          InputPathsMap:
            executionArn: $.detail.executionArn
            status: $.detail.status
            name: $.detail.name
            stopDate: $.detail.stopDate
          InputTemplate: |
            {
              "default": "🚨 NYC Taxi Pipeline FAILED",
              "email": "NYC Taxi Data Pipeline Alert\n\nStatus: <status>\nExecution: <name>\nTime: <stopDate>\n\nView details:\nhttps://console.aws.amazon.com/states/home?region=eu-west-2#/executions/details/<executionArn>"
            }

# EventBridge Rule: Pipeline Succeeded
PipelineSuccessRule:
  Type: AWS::Events::Rule
  Properties:
    Name: !Sub ${AWS::StackName}-pipeline-success
    State: ENABLED
    EventPattern:
      source:
        - aws.states
      detail-type:
        - Step Functions Execution Status Change
      detail:
        status:
          - SUCCEEDED
        stateMachineArn:
          - !Ref TaxiPipelineStateMachine
    Targets:
      - Arn: !Ref PipelineNotificationTopic
        Id: SuccessNotification
        InputTransformer:
          InputPathsMap:
            name: $.detail.name
            stopDate: $.detail.stopDate
          InputTemplate: |
            {
              "default": "✅ NYC Taxi Pipeline completed successfully",
              "email": "NYC Taxi Data Pipeline\n\nStatus: SUCCESS\nExecution: <name>\nCompleted: <stopDate>"
            }

# Permission for EventBridge to publish to SNS
SNSTopicPolicy:
  Type: AWS::SNS::TopicPolicy
  Properties:
    Topics:
      - !Ref PipelineNotificationTopic
    PolicyDocument:
      Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sns:Publish
          Resource: !Ref PipelineNotificationTopic


# ==================== OUTPUTS ====================

Outputs:
  BronzeBucketName:
    Description: Bronze S3 Bucket Name
    Value: !Ref BronzeTaxiBucket
    Export:
      Name: !Sub ${AWS::StackName}-BronzeBucket

  SilverBucketName:
    Description: Silver S3 Bucket Name
    Value: !Ref SilverTaxiBucket
    Export:
      Name: !Sub ${AWS::StackName}-SilverBucket

  GoldBucketName:
    Description: Gold S3 Bucket Name (Finance layer)
    Value: !Ref GoldTaxiBucket
    Export:
      Name: !Sub ${AWS::StackName}-GoldBucket

  GlueScriptsBucketName:
    Description: Glue Scripts Bucket Name
    Value: !Ref GlueScriptsBucket
    Export:
      Name: !Sub ${AWS::StackName}-ScriptsBucket

  GlueDatabaseName:
    Description: Glue Database Name
    Value: !Ref TaxiDataCatalogDatabase
    Export:
      Name: !Sub ${AWS::StackName}-GlueDatabase

  LambdaFunctionName:
    Description: Lambda Function Name
    Value: !Ref TaxiExtractorFunction

  SilverETLJobName:
    Description: Bronze to Silver Glue Job Name
    Value: !Ref TaxiSilverTransformationJob

  GoldFinanceJobName:
    Description: Silver to Gold Finance Glue Job Name
    Value: !Ref GoldFinanceJob

  GoldOperationsJobName:
    Description: Silver to Gold Operations Glue Job Name
    Value: !Ref GoldOperationsJob

  BronzeCrawlerName:
    Description: Bronze Crawler Name
    Value: !Ref BronzeTaxiCrawler

  SilverCrawlerName:
    Description: Silver Crawler Name
    Value: !Ref SilverTaxiCrawler

  GoldCrawlerName:
    Description: Gold Crawler Name
    Value: !Ref GoldTaxiCrawler

  GoldOperationsCrawlerName:
    Description: Gold Crawler Name
    Value: !Ref GoldOperationsCrawler

  StateMachineArn:
    Description: Step Functions State Machine ARN
    Value: !Ref TaxiDataPipelineStateMachine

  DataCatalogConsoleURL:
    Description: Glue Data Catalog Console URL
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/glue/home?region=${AWS::Region}#/v2/data-catalog/databases/view/${TaxiDataCatalogDatabase}


  NotificationTopicArn:
    Description: SNS Topic for Pipeline Notifications
    Value: !Ref PipelineNotificationTopic

  StepFunctionsConsoleURL:
    Description: Step Functions Console URL
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/states/home?region=${AWS::Region}#/statemachines/view/${TaxiDataPipelineStateMachine}